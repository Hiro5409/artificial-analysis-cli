# Fast local feedback. CI runs the complete quality gate whether or not these hooks are installed.
pre-commit:
  parallel: true
  jobs:
    - name: lint
      glob: "*.py"
      run: uv run --locked ruff check --force-exclude {staged_files}
    - name: format
      glob: "*.py"
      run: uv run --locked ruff format --check --force-exclude {staged_files}
    - name: types
      glob: "*.py"
      run: uv run --locked ty check

pre-push:
  jobs:
    - name: tests
      run: uv run --locked pytest
