name: OpenAPI drift

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openapi-drift
  cancel-in-progress: true

jobs:
  check:
    name: Official contract matches the snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --locked
      - name: Compare with the official contract
        run: |
          uv run --locked scripts/update_client.py fetch
          uv run --locked scripts/update_client.py generate
          git diff --exit-code -- openapi/artificial-analysis.yaml src/artificial_analysis_cli/_generated
